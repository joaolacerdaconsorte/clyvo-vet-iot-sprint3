<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#14b8a6" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad)" />

  <!-- Top Title Header -->
  <g id="header">
    <text x="60" y="55" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      CLYVO VET <tspan fill="#14b8a6">• PetCare 360</tspan> — Arquitetura de IA Híbrida &amp; IoT
    </text>
    <text x="60" y="80" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">
      Disruptive Architectures: IoT, IoB &amp; Generative IA | FIAP 2026 | Sprint 3 — Turma 2TDSPW
    </text>
  </g>

  <!-- Flow Boxes -->

  <!-- 1. IoT EDGE -->
  <g id="box-iot" transform="translate(50, 120)" filter="url(#dropShadow)">
    <rect width="210" height="480" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="210" height="42" rx="16" fill="url(#tealGrad)" />
    <rect y="26" width="210" height="16" fill="url(#tealGrad)" />
    <text x="105" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1. DISPOSITIVO IOT (BORDA)</text>
    
    <!-- Content inside IoT -->
    <rect x="15" y="60" width="180" height="100" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="25" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Microcontrolador ESP32</text>
    <text x="25" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• CPU Dual Core 240MHz</text>
    <text x="25" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Wi-Fi 802.11 b/g/n</text>
    <text x="25" y="142" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Simulação: Wokwi IoT</text>

    <rect x="15" y="175" width="180" height="110" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="25" y="197" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399">Sensores &amp; Atuadores</text>
    <text x="25" y="217" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Sensor DHT22 (Temp/Umid)</text>
    <text x="25" y="237" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• LED RGB Indicador Local</text>
    <text x="25" y="257" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Acelerômetro (IoB Atividade)</text>
    <text x="25" y="275" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Buffer local a cada 5s</text>

    <rect x="15" y="300" width="180" height="80" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="25" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">Payload JSON Wearable</text>
    <text x="25" y="342" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">{"pet_id": 1,</text>
    <text x="25" y="357" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8"> "temp": 39.8, "umid": 54}</text>

    <rect x="15" y="395" width="180" height="65" rx="8" fill="#14532d" fill-opacity="0.3" stroke="#22c55e" stroke-width="1" />
    <text x="105" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#4ade80" text-anchor="middle">STATUS: CONECTADO</text>
    <text x="105" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#86efac" text-anchor="middle">HiveMQ Broker Online</text>
  </g>

  <!-- 2. MESSAGING & BROKER -->
  <g id="box-broker" transform="translate(300, 170)" filter="url(#dropShadow)">
    <rect width="190" height="380" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="190" height="42" rx="16" fill="url(#blueGrad)" />
    <rect y="26" width="190" height="16" fill="url(#blueGrad)" />
    <text x="95" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. MENSAGERIA MQTT</text>

    <rect x="15" y="60" width="160" height="110" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="25" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">Broker HiveMQ Cloud</text>
    <text x="25" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Protocolo: MQTT 3.1.1</text>
    <text x="25" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Porta: 1883 / 8883 (TLS)</text>
    <text x="25" y="142" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• QoS: Nível 1 Garantido</text>
    <text x="25" y="160" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Conexões simultâneas</text>

    <rect x="15" y="185" width="160" height="165" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="25" y="207" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Tópicos &amp; Canais</text>
    <text x="25" y="227" font-family="'Segoe UI', monospace" font-size="10" fill="#f87171">PUB: petcare360/telemetria</text>
    <text x="25" y="247" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94a3b8">→ Streaming dos sensores</text>
    <text x="25" y="277" font-family="'Segoe UI', monospace" font-size="10" fill="#4ade80">SUB: petcare360/alertas</text>
    <text x="25" y="297" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94a3b8">← Acionamento LED/Buzzer</text>
    <text x="25" y="325" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Baixa latência (&lt;80ms)</text>
  </g>

  <!-- 3. AI CORE (ENGINE) -->
  <g id="box-ai" transform="translate(530, 100)" filter="url(#dropShadow)">
    <rect width="360" height="520" rx="16" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="2" />
    <rect width="360" height="42" rx="16" fill="url(#purpleGrad)" />
    <rect y="26" width="360" height="16" fill="url(#purpleGrad)" />
    <text x="180" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3. NÚCLEO DE IA HÍBRIDA (CLYVO AI)</text>

    <!-- Submodule A: Ingestion & Feature Engineering -->
    <rect x="20" y="55" width="320" height="85" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="30" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#c084fc">Gateway de Ingestão &amp; Feature Store</text>
    <text x="30" y="95" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Validação de integridade &amp; Enriquecimento de telemetria</text>
    <text x="30" y="113" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Vetor: [Espécie, Idade, Temp, Δ24h, Vacinas, Peso, IoB Atividade]</text>
    <text x="30" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94a3b8">Persistência em Banco Relacional / Prontuário</text>

    <!-- Submodule B: Predictive ML -->
    <rect x="20" y="150" width="320" height="150" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5" />
    <text x="30" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#a78bfa">Camada Preditiva: Random Forest Classifier</text>
    <text x="30" y="192" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Acurácia de Validação: <tspan font-weight="bold" fill="#4ade80">93.40%</tspan> (100 árvores balanceadas)</text>
    <text x="30" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Cálculo do <tspan font-weight="bold" fill="#38bdf8">Índice de Risco Preventivo (IRP)</tspan> Contínuo</text>
    <text x="30" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Classificação: Baixo | Moderado | Alto | Crítico</text>
    <text x="30" y="246" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Matriz de Probabilidade calibrada para triagem</text>
    <text x="30" y="266" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#facc15">Explicabilidade (XAI):</text>
    <text x="30" y="284" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#e2e8f0">Gera Fatores Patológicos Determinantes (Elimina Caixa Preta)</text>

    <!-- Submodule C: Generative Agent -->
    <rect x="20" y="310" width="320" height="190" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
    <text x="30" y="332" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#f472b6">Camada Generativa: Grounded Clinical Assistant</text>
    <text x="30" y="352" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Ancoragem estrita nas features e no score do Random Forest</text>
    
    <rect x="30" y="365" width="140" height="120" rx="6" fill="#1e293b" />
    <text x="38" y="385" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Tutor Copilot</text>
    <text x="38" y="403" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#cbd5e1">• Linguagem afetiva</text>
    <text x="38" y="421" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#cbd5e1">• Sem termos técnicos</text>
    <text x="38" y="439" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#cbd5e1">• Recomendações</text>
    <text x="38" y="457" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#cbd5e1">• Agendamento ágil</text>

    <rect x="185" y="365" width="145" height="120" rx="6" fill="#1e293b" />
    <text x="193" y="385" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">Vet Clinical Assist.</text>
    <text x="193" y="403" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#cbd5e1">• Formato SOAP padroniz.</text>
    <text x="193" y="421" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#cbd5e1">• Diagnósticos diferenc.</text>
    <text x="193" y="439" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#cbd5e1">• Plano de conduta</text>
    <text x="193" y="457" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#cbd5e1">• Triagem de urgência</text>
  </g>

  <!-- 4. CLIENT APPLICATIONS -->
  <g id="box-apps" transform="translate(930, 120)" filter="url(#dropShadow)">
    <rect width="220" height="480" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="220" height="42" rx="16" fill="url(#amberGrad)" />
    <rect y="26" width="220" height="16" fill="url(#amberGrad)" />
    <text x="110" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4. APLICAÇÕES &amp; USUÁRIOS</text>

    <!-- Tutor App -->
    <rect x="15" y="60" width="190" height="180" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="25" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">Aplicativo Mobile do Tutor</text>
    <text x="25" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Feed de Saúde em Tempo Real</text>
    <text x="25" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Alertas Push Proativos</text>
    <text x="25" y="142" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Histórico térmico &amp; IoB</text>
    <text x="25" y="162" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Botão 1-Clique Agendamento</text>
    <text x="25" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Gamificação de Cuidados</text>
    <text x="25" y="202" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Carteirinha Vacinal Digital</text>
    <text x="25" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94a3b8">Experiência Humanizada</text>

    <!-- Clinic Dashboard -->
    <rect x="15" y="260" width="190" height="200" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="25" y="282" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#14b8a6">Portal Clínico Clyvo Vet</text>
    <text x="25" y="302" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Dashboard Web Interativo</text>
    <text x="25" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Fila de Triagem por Risco</text>
    <text x="25" y="342" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Prontuário SOAP Integrado</text>
    <text x="25" y="362" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Análise de Probabilidades ML</text>
    <text x="25" y="382" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Exames Sugeridos pela IA</text>
    <text x="25" y="402" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Supervisão Humana (CRMV)</text>
    <text x="25" y="422" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#cbd5e1">• Conformidade LGPD &amp; Ética</text>
    <text x="25" y="442" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94a3b8">Medicina Baseada em Evidências</text>
  </g>

  <!-- Connective Arrows -->
  <line x1="260" y1="360" x2="295" y2="360" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="490" y1="360" x2="525" y2="360" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="890" y1="360" x2="925" y2="360" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrowPurple)" />

  <!-- Footer Info -->
  <g id="footer" transform="translate(60, 645)">
    <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">
      Integrantes: João Vitor Lacerda (565565) | Kauan Vieira de Lima (565403) | Murillo Fernandes Carapia (564969) | Pedro de Matos Previtali (564184)
    </text>
  </g>
</svg>
